<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe + Three.js AR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: sans-serif;
        }
        /* Myndband í bakgrunni */
        #webcam {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        /* Three.js striginn ofan á myndbandinu */
        #three-canvas {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="loading">Hleður MediaPipe og myndavél...</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>

    <!-- Notum Import Maps til að sækja Three.js og MediaPipe beint úr CDN -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        let handLandmarker;
        let video = document.getElementById('webcam');
        let cube, scene, camera, renderer;
        let lastVideoTime = -1;

        async function init() {
            // 1. Stilla Three.js senu
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('three-canvas'), 
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Bæta við litríkum teningi
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            camera.position.z = 5;

            // 2. Frumstilla MediaPipe HandLandmarker
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            // 3. Ræsa myndavél (notar afturmyndavél í síma ef hún er til staðar, eða vefmyndavél í tölvu)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    document.getElementById('loading').style.display = 'none';
                    predictWebcam();
                });
            } catch (err) {
                document.getElementById('loading').innerText = "Villa við að opna myndavél: " + err.message;
            }
        }

        // 4. Lykkja sem keyrir í hverjum ramma (AnimationFrame)
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                if (handLandmarker) {
                    const results = handLandmarker.detectForVideo(video, performance.now());

                    if (results.landmarks && results.landmarks.length > 0) {
                        const landmarks = results.landmarks[0];
                        const indexTip = landmarks[8]; // Vísifingursgómur

                        // Umreikna MediaPipe hnit [0, 1] yfir í Three.js hnit
                        const targetX = (indexTip.x - 0.5) * -6;
                        const targetY = -(indexTip.y - 0.5) * 6;
                        const targetZ = -indexTip.z * 5;

                        // Nota LERP til að gera hreyfinguna mjúka og koma í veg fyrir titring
                        cube.position.x = THREE.MathUtils.lerp(cube.position.x, targetX, 0.2);
                        cube.position.y = THREE.MathUtils.lerp(cube.position.y, targetY, 0.2);
                        cube.position.z = THREE.MathUtils.lerp(cube.position.z, targetZ, 0.2);

                        // Láta teninginn snúast aðeins þegar hann hreyfist
                        cube.rotation.x += 0.02;
                        cube.rotation.y += 0.02;
                    }
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(predictWebcam);
        }

        // Látum strigann fylgja stærð skjásins ef glugganum er breytt
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
